name: Deploy Spring Boot JAR to Oracle Cloud VM

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Copy JAR to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_CLOUD_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_CLOUD_SSH_KEY }}
          source: build/libs/*.jar
          target: /home/ubuntu/app/app.jar

      - name: Restart Spring Boot app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_CLOUD_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_CLOUD_SSH_KEY }}
          script: |
            pkill -f 'java -jar' || true
            nohup java -jar /home/ubuntu/app/app.jar \
              --spring.datasource.url=${{ secrets.DB_URL }} \
              --spring.datasource.username=${{ secrets.DB_USER }} \
              --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
              > /home/ubuntu/app/app.log 2>&1 &
            sleep 2
            exit 0

