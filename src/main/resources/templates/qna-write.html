<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문 작성 - The SkyGradU</title>
    <link href="/webapp/css/basic.css" rel="stylesheet">
    <link href="/webapp/css/auth.css" rel="stylesheet">
    <link href="/webapp/css/mypage.css" rel="stylesheet">
    <link href="/webapp/css/styles.css" rel="stylesheet">
    <link href="/webapp/css/qna-write.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <script defer src="/webapp/js/qna-write.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="qna-write-container">
    <h2 class="qna-write-title">질문 작성</h2>

    <div class="qna-write-form">
        <form id="qna-form">
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" class="form-control" placeholder="제목을 입력하세요">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="anonymous">
                <label for="anonymous">익명</label>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" class="form-control" rows="5" placeholder="내용을 입력하세요"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">질문 등록</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
