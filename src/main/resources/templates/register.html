<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The SkyGradU</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/webapp/images/icon.png">
    <link rel="manifest" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/manifest.json">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="mask-icon" href="/webapp/images/icon.png" color="#712cf9">
    <link rel="icon" href="/webapp/images/icon.ico">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="#ffffff">

    <style>
        .info_content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .background {
            background: url('/webapp/images/background.png') no-repeat center top;
            background-size: cover;
        }
        .show-password1{
            cursor: pointer;
        }
        .show-password2 {
            cursor: pointer;
        }
        .login-form .action2 button{
            width: 100%;
            border: none;
            padding: 18px;
            font-family: 'Pretendard', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            background-color: #87CEEB;
            border-color: #87CEEB;
            color: #FFFFFF;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            letter-spacing: 0.2px;
            outline: 0;
            -webkit-transition: all .3s;
            transition: all .3s;
        }
        .login-form .action2 button:hover {
            background-color: #20B2AA;
            border-color: #20B2AA;
            color: #000000;
        }
        .content .label{
        text-style:bold;
        }
    </style>

    <link href="/webapp/css/basic.css" rel="stylesheet">
    <link href="/webapp/css/auth.css" rel="stylesheet">

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center">
<nav class="container-fluid">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-2 border-bottom">
        <a href="/" class="d-flex align-items-center mb-2 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <lottie-player src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 40px; height: 32px" loop autoplay></lottie-player>
            <span class="fs-4" style="color: #000000;">The SkyGradU</span>
        </a>

        <ul class="nav nav-pills navbar-expand-md">
            <li class="nav-item">
                <a href="/" class="nav-link" onclick="showContent('home', this)" >Home</a>
            </li>
            <li class="nav-item">
                <a href="/qna" class="nav-link" onclick="showContent('faqs', this)">FAQs</a>
            </li>
            <li class="nav-item">
                <a href="" class="nav-link" onclick="showContent('explain', this)">이용안내</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated() and !hasAuthority('ROLE_ADMIN')">
                <a href="/mypage" class="nav-link" onclick="showContent('mypage', this)">마이페이지</a>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a href="/admin" class="nav-link" onclick="showContent('admin', this)">관리자</a>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a href="/login" class="nav-link" onclick="showContent('login', this)">로그인</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a href="/logout" class="nav-link" onclick="showContent('logout', this)">로그아웃</a>
            </li>

        </ul>
    </header>
</nav>

<div class="background">
    <div class="info_content" style="text-align: center; margin-top: 10px;">
        <div class="login-form">
            <div class="login_logo">
                <lottie-player id="home_logo" src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 100px; height: 80px" loop autoplay></lottie-player>
            </div>
            <div class="cutstom_login_title"><b>회원가입</b></div>
            <form id="register-form" method="post">
                <div class="content">
                    <div class="box-margin1">
                        <label>이름</label>
                        <input class="form-control form-readonly" type="text" name="userName" th:value="${userDetails.userName}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>학번</label>
                        <input class="form-control form-readonly" type="text" name="studentID" th:value="${userDetails.studentID}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>학과</label>
                        <input class="form-control form-readonly" type="text" name="major" th:value="${userDetails.major}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>이메일</label>
                        <input class="form-control form-readonly" type="email" name="userEmail" th:value="${userDetails.userEmail}" readonly>
                    </div>
                    <div>
                    <input class="form-control form-readonly" type="hidden" name="portalID" th:value="${userDetails.portalID}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>비밀번호</label>
                        <div class="input-group flex-nowrap">
                            <input class="form-control" id="pw1" type="password" name="password1" th:value="${password1}" placeholder="8자 이상 입력해주세요">
                            <span class="input-group-text show-password1" onclick="togglePassword1()">🙈</span>
                        </div>
                        <div class='regi_guide' style="color: rgb(1, 42, 127);">
                            The SkyGradU의 <b>고유 비밀번호</b>를 설정 해주세요.
                        </div>
                    </div>
                    <div class="box-margin1" >
                        <label>비밀번호 재확인</label>
                        <div class="input-group flex-nowrap">
                            <input class="form-control" id="pw2" type="password" name="password2" th:value="${password2}">
                            <span class="input-group-text show-password2" onclick="togglePassword2()">🙈</span>
                        </div>
                    </div>
                    <div id="error-message" style="color: red; margin-top: 1rem;"></div>
                </div>
                <div class="action2">
                    <button class="button-text" id="register_button" type="submit">가입하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="text-white-100 mastfoot mt-auto">
    <p>© The SkyGradU 2024</p>
    <a href="/faqs/privacy" style="color: #ffffff;">개인정보처리방침</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/webapp/js/register.js">
</script>
</body>
</html>
