<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The SkyGradU</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/webapp/images/icon.png">
    <link rel="manifest" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/manifest.json">
    <link rel="mask-icon" href="/webapp/images/icon.png" color="#712cf9">
    <link rel="icon" href="/webapp/images/icon.ico">
    <meta name="theme-color" content="#712cf9">

    <style>
        /* 동일한 CSS 스타일 추가 */
        html, body {
            height: 100%;
            font-family: 'Nunito Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-color: #ffffff;
            color: #000000;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .cover-container {
            max-width: 42em;
        }

        .nav-masthead .nav-link {
            padding: 0.25rem 0.75rem;
            font-weight: 700;
            color: #000000;
            background-color: transparent;
            border-bottom: 0.25rem solid transparent;
            display: flex;
            align-items: center;
        }

        .nav-masthead .active {
            color: #0064E4;
            border-bottom-color: #0064E4;
        }

        .mastfoot {
            color: #FFFFFF;
            text-align: left;
            padding: 5px 10px;
            background-color: #000000;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center.
        }

        .mastfoot p,
        .mastfoot a {
            font-size: 14px;
            margin: 0;
        }

        .mastfoot a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
        }

        @media (max-width: 768px) {
            .mastfoot p,
            .mastfoot a {
                font-size: 12px;
            }
        }

        .lead {
            color: #000000;
            text-align: center.
        }

        .btn-primary:hover,
        .btn-primary:focus,
        .btn-primary:active {
            background-color: #0056b3;
            border-color: #0056b3.
        }

        .link-body-emphasis {
            pointer-events: none;
            cursor: default.
        }

        .flex-fill {
            flex: 1 0 auto.
        }

        .modal-content {
            background-color: transparent.
            border: none.
            box-shadow: none.
        }

        .modal-dialog {
            margin-top: 20%.
        }

        .modal-sheet {
            background-color: rgba(0, 0, 0, 0.5).
        }

        .modal-content.rounded-4 {
            border-radius: 0.5rem.
        }

        .modal-body.py-0 {
            padding-top: 0.
            padding-bottom: 0.
        }

        .modal-header.border-bottom-0 {
            border-bottom: none.
        }
    </style>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center">
<nav class="container-fluid">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-2 border-bottom">
        <a href="/" class="d-flex align-items-center mb-2 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <lottie-player src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 40px; height: 32px" loop autoplay></lottie-player>
            <span class="fs-4" style="color: #000000;">The SkyGradU</span>
        </a>

        <ul class="nav nav-pills navbar-expand-md">
            <li class="nav-item"><a href="/" class="nav-link" th:href="@{/}">Home</a></li>
            <li class="nav-item"><a href="/qna" class="nav-link" th:href="@{/faqs}">FAQs</a></li>
            <li class="nav-item"><a href="" class="nav-link" th:href="@{/explain}">이용안내</a></li>
            <li class="nav-item"><a href="/login" class="nav-link" th:href="@{/login}">로그인</a></li>
        </ul>
    </header>
</nav>

<div class="flex-fill">
    <main class="flex-fill">
        <div class="navbar-img">
            <img class="navbar-img-image" src="/webapp/images/home.jpg"/>
            <div class="navbar-img__text">
                <span class="navbar-img__text--title">회원가입</span>
                <span class="navbar-img__text--subtitle">스카이 그래듀의 고유 비밀번호를 설정해주세요.</span>
            </div>
        </div>
        <div class="white_sec">
            <div class="container white-box">
                <form id="register-form" method="post" th:action="@{/register}" onsubmit="return check_up();">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"> <!-- CSRF 토큰 추가 -->
                    <div class="box-margin3">
                        <label>이름</label>
                        <input class="form-control form-readonly" type="text" name="name" th:value="${name}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>학번</label>
                        <input class="form-control form-readonly" type="text" name="username" th:value="${id}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>학과</label>
                        <input class="form-control form-readonly" type="text" name="department" th:value="${department}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>이메일</label>
                        <input class="form-control form-readonly" type="text" name="email" th:value="${email}" readonly>
                    </div>
                    <div class="box-margin1">
                        <label>비밀번호</label>
                        <input class="form-control" id="pw1" type="password" name="password1" th:value="${password1}">
                        <div class='regi_guide' style="color: rgb(1, 42, 127);">
                            - 스카이 그래듀의 고유 비밀번호를 설정해주세요.
                        </div>
                    </div>
                    <div class="box-margin1">
                        <label>비밀번호 재확인</label>
                        <input class="form-control" id="pw2" type="password" name="password2" th:value="${password2}">
                    </div>
                    <div style="text-align: center;">
                        <input type='submit' class='btn btn-primary button-sm' style="margin-top:2.5rem; margin-bottom: 3rem;" value='가입하기'>
                    </div>
                    <div id="error-message" style="color:red;"></div>
                </form>
            </div>
        </div>
    </main>
</div>

<footer class="text-white-100 mastfoot mt-auto">
    <p>© The SkyGradU 2024</p>
    <a href="/faqs/privacy" style="color: #ffffff;">개인정보처리방침</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function check_up() {
        if (!document.getElementById('pw1').value) {
            alert('😢 비밀번호를 입력해주세요.');
            document.getElementById('pw1').focus();
            return false;
        }
        if (document.getElementById('pw1').value !== document.getElementById('pw2').value) {
            alert('😢 비밀번호가 일치하지 않습니다.');
            document.getElementById('pw1').focus();
            return false;
        }
        return true;
    }

    $(document).ready(function() {
        $('#register-form').submit(function(event) {
            event.preventDefault();
            $.ajax({
                url: '/register',
                type: 'POST',
                data: {
                    username: $('input[name="username"]').val(),
                    password: $('#pw1').val()
                },
                success: function() {
                    window.location.href = '/login';
                },
                error: function() {
                    $('#error-message').text('회원가입 중 오류가 발생했습니다.');
                }
            });
        });
    });
</script>
</body>
</html>
