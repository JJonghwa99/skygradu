<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문 상세보기</title>
    <link href="/webapp/css/basic.css" rel="stylesheet">
    <link href="/webapp/css/auth.css" rel="stylesheet">
    <link href="/webapp/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        .detail-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .detail-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .detail-meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .detail-content {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }

        .answer-card {
            background-color: #dcdcdc;
            border-left: 4px solid #007aff;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }

        .answer-header {
            font-size: 16px;
            font-weight: 600;
            color: #007aff;
            margin-bottom: 10px;
        }

        .answer-content {
            font-size: 14px;
            line-height: 1.6;
            color: #;
        }

        .btn-back {
            display: inline-block;
            background-color: #007aff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #005bbb;
            color: #fff;
        }
        .answer-area{
            min-width: 700px;
            min-height: 200px;
        }
        .button-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="detail-card">
        <div class="detail-header" th:text="${qna.QTitle}">질문 제목</div>
        <div class="detail-meta">
            작성자:
            <span th:text="${qna.Anonymity} ? '익명' : ${qna.QWriter}"></span> ·
            작성일:
            <span th:text="${#temporals.format(qna.QDate, 'yyyy-MM-dd')}"></span>
        </div>
        <div class="detail-content" th:text="${qna.QContent}"></div>

        <form id="answer-form" style="display: none;" method="POST" th:action="@{/qna/answer/{id}(id=${qna.id})}">
            <h2 style="border-bottom: 2px solid #333; padding-bottom: 5px;"></h2>
            <textarea class="answer-area" name="answerContent" rows="4" placeholder="답변 내용을 입력하세요"></textarea><br/>
            <button type="submit" class="btn btn-success">답변 등록</button>
        </form>

        <!-- 답변 표시 -->
        <div th:if="${qna.Answered}" class="answer-card">
            <div class="answer-header">답변</div>
            <div class="detail-meta">
                작성자: 관리자 · 작성일:
                <span th:text="${#temporals.format(qna.ADate, 'yyyy-MM-dd')}"></span>
            </div>
            <div class="answer-content" th:text="${qna.AContent}"></div>
        </div>
    </div>

    <div class="button-container">
        <!-- 뒤로 가기 버튼 -->
        <a href="/qna" class="btn-back" >뒤로 가기</a>

        <!-- 관리자 버튼 -->
        <div th:if="${isAdmin}" class="admin-buttons"  style="display: flex;">
            <button onclick="toggleAnswerForm()" class="btn btn-primary" style="margin-right: 8pt; background-color:#20B2AA;">답변하기</button>
            <form method="POST" th:action="@{/qna/delete/{id}(id=${qna.id})}" >
                <button type="submit" class="btn btn-danger">삭제</button>
            </form>
        </div>

        <!-- 작성자 버튼 -->
        <div th:if="${isWriter and !qna.Answered}" class="writer-buttons"  style="float: right;">
            <form method="POST" th:action="@{/qna/delete/{id}(id=${qna.id})}">
                <button type="submit" class="btn btn-danger">삭제</button>
            </form>
        </div>
    </div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
<script>
    function toggleAnswerForm() {
    const form = document.getElementById("answer-form");
    if (form.style.display === "none" || form.style.display === "") {
        form.style.display = "block";
    } else {
        form.style.display = "none";
    }
}
</script>
</html>
