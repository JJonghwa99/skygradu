<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용안내 - The SkyGradU</title>
    <link href="/webapp/css/basic.css" rel="stylesheet">
    <link href="/webapp/css/auth.css" rel="stylesheet">
    <link href="/webapp/css/mypage.css" rel="stylesheet">
    <link href="/webapp/css/styles.css" rel="stylesheet">
    <link href="/webapp/css/guide.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="guide-tabs">
    <button class="guide-tab active" onclick="location.href='/guide'">이용안내</button>
    <button class="guide-tab" onclick="location.href='/privacy'">개인정보처리방침</button>
</div>

<main class="guide-container">
    <h2 class="guide-title">이용안내 및 주의사항</h2>

    <div class="guide-content">
        <h3>📌 이용안내</h3>
        <ul>
            <li>편입생, 교직이수, 다전공, 외국인유학생 입학자에게 해당하는 사용자 검사는 기준이 다릅니다.</li>
            <li>추천 과목 정보는 2025학년도 1학기 기준으로 제공합니다.</li>
            <li>검사 기준은 2025학년도 1학기 교육과정 기준입니다.</li>
        </ul>

        <h3>⚠️ 주의사항</h3>
        <p>사용자의 성결대학교 포털 사이트의 비밀번호는 저장되지 않으며, 인증용으로만 사용됩니다.</p>
        <p>성결대학교 공식적인 검사는 아니며, 참고 자료로 활용됩니다.</p>
        <p>회원가입 시, PC에서 크롬을 통해 접근을 권장합니다.</p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/webapp/js/guide.js"></script>
</body>
</html>
