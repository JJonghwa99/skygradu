<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The SkyGradU</title>
    <link href="/webapp/css/basic.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/webapp/images/icon.png">
    <link rel="manifest" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/manifest.json">
    <link rel="mask-icon" href="/webapp/images/icon.png" color="#712cf9">
    <link rel="icon" href="/webapp/images/icon.ico">
    <meta name="theme-color" content="#712cf9">

    <style>

    </style>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center">
<nav class="container-fluid">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-2 border-bottom">
        <a href="/" class="d-flex align-items-center mb-2 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <lottie-player src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 40px; height: 32px" loop autoplay></lottie-player>
            <span class="fs-4" style="color: #000000;">The SkyGradU</span>
        </a>

        <ul class="nav nav-pills navbar-expand-md">
            <li class="nav-item"><a href="/" class="nav-link" th:href="@{/}">Home</a></li>
            <li class="nav-item"><a href="/qna" class="nav-link" th:href="@{/faqs}">FAQs</a></li>
            <li class="nav-item"><a href="" class="nav-link" th:href="@{/explain}">이용안내</a></li>
            <li class="nav-item"><a href="/login" class="nav-link" th:href="@{/login}">로그인</a></li>
        </ul>
    </header>
</nav>

<div class="flex-fill">
    <main class="flex-fill">
        <div class="container py-5" id="main-content">
            <div class="row">
                <div class="col-md-6 offset-md-3">
                    <h1 class="mb-4">성결대 학생 인증</h1>
                    <form id="auth-form" action="/auth" method="post">
                        <div id="auth-section">
                            <div class="mb-3">
                                <label for="userId" class="form-label">포털 아이디:</label>
                                <input type="text" id="userId" name="userId" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">포털 비밀번호:</label>
                                <input type="password" id="password" name="password" class="form-control">
                            </div>
                            <div class="mb-3">
                                <button type="submit" id="auth-button" class="btn btn-primary">인증하기</button>
                            </div>
                        </div>
                        <div id="error-message" style="color:red;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<footer class="text-white-100 mastfoot mt-auto">
    <p>© The SkyGradU 2024</p>
    <a href="/faqs/privacy" style="color: #ffffff;">개인정보처리방침</a>
</footer>

<!-- Modal -->
<div class="modal modal-sheet position-fixed d-none bd-body-secondary p-4 py-md-5" tabindex="-1" role="dialog" id="modalSheet">
    <div class="modal-dialog">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header border-bottom-0">
                <h1 class="modal-title fs-5">인증 중 ... </h1>
            </div>
            <div class="modal-body py-0">
                <lottie-player src="/webapp/json/loading.json" background="transparent" speed="1" style="width: 100px; height: 100px;" loop autoplay></lottie-player>
                <p class="text-muted">학생 인증 중입니다. 창을 이동하지 마세요!</p>
            </div>
        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
