<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="#ffffff">
    <title>Q&A 게시판</title>
    <link href="/css/basic.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
    <link href="/css/mypage.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/qna.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icon.png">
    <link rel="manifest" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/manifest.json">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="mask-icon" href="/images/icon.png" color="#712cf9">
    <link rel="icon" href="/images/icon.ico">
    <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
        font-family: 'Pretendard', sans-serif;
        background-color: white;
        color: #333;
        margin: 0;
        padding: 0;
    }
</style>
</head>
<body class="d-flex flex-column h-100 text-center">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <!--<div class="list-header">Q&A 게시판</div>-->

    <div class="list-container">
        <div class="list-tab">
            <button onclick="location.href='/faq'">FAQs</button>
            <button class="active" onclick="location.href='/qna'">Q&A</button>
        </div>

        <!-- 질문 카드 -->
        <div th:each="qna : ${qnaList}" class="question-card">
            <div class="question-header">
                <h3 class="question-title" th:text="${qna.QTitle}">질문 제목</h3>
                <span class="question-status"
                      th:text="${qna.Answered} ? '답변완료' : '접수'"
                      th:classappend="${qna.Answered} ? 'answered' : 'pending'">
            </span>
            </div>
            <p class="question-info">
                작성자: <span th:text="${qna.Anonymity} ? '익명' : ${qna.QWriter}"></span> ·
                작성일: <span th:text="${#temporals.format(qna.QDate, 'yyyy-MM-dd')}"></span>
            </p>
            <div class="question-footer">
                <a th:href="@{/qna/detail/{id}(id=${qna.id})}">자세히 보기</a>
            </div>
        </div>

        <a href="/qna/write" class="btn-primary"
           style="margin-top: 20px; display: block; text-align: center;"
           sec:authorize="isAuthenticated()">
            질문 등록
        </a>
    </div>

    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">

            <!-- 이전 페이지 버튼 -->
            <li th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="${currentPage > 0} ? @{/qna(page=${currentPage - 1})} : ''"
                   aria-label="Previous">
                    <span aria-hidden="true"><i class="fas fa-arrow-left"></i></span>
                </a>
            </li>

            <!-- 페이지 번호 표시 -->
            <li th:each="pageNum : ${#numbers.sequence(startPage + 1, endPage + 1)}"
                th:classappend="${pageNum - 1 == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/qna(page=${pageNum - 1})}"
                   th:text="${pageNum}">1</a>
            </li>

            <!-- 다음 페이지 버튼 -->
            <li th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="${currentPage < totalPages - 1} ? @{/qna(page=${currentPage + 1})} : ''"
                   aria-label="Next">
                    <span aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
                </a>
            </li>

        </ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/js/qna.js"></script>
</body>
</html>
