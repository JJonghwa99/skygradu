<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQs - The SkyGradU</title>
  <link href="/webapp/css/basic.css" rel="stylesheet">
  <link href="/webapp/css/auth.css" rel="stylesheet">
  <link href="/webapp/css/mypage.css" rel="stylesheet">
  <link href="/webapp/css/styles.css" rel="stylesheet">
  <link href="/webapp/css/faq.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <script src="https://use.fontawesome.com/releases/v6.0.0/js/all.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="faq-container">
  <h2 class="faq-title">자주 묻는 질문</h2>

  <div class="faq-tabs">
    <button class="faq-tab active" onclick="window.location.href='/faq'">FAQs</button>
    <button class="faq-tab" onclick="window.location.href='/qna'">Q&A</button>
  </div>

  <div class="faq-list">
    <div class="faq-item">
      <button class="faq-question">모든 학과가 졸업요건 검사가 가능한가요? <span class="toggle-icon">+</span></button>
      <div class="faq-answer">네, 모든 학과가 검사 가능합니다. 단, 성결대의 공식 사이트가 아니므로 참고용으로만 사용하시기 바랍니다.</div>
    </div>
    <div class="faq-item">
      <button class="faq-question">로그인 오류가 발생하면 어떻게 하나요? <span class="toggle-icon">+</span></button>
      <div class="faq-answer">로그인 오류가 발생하면 비밀번호를 재설정하거나, 관리자에게 문의하세요.</div>
    </div>
    <div class="faq-item">
      <button class="faq-question">졸업요건 검사는 어떻게 하나요? <span class="toggle-icon">+</span></button>
      <div class="faq-answer">마이페이지의 기이수과목 업로드를 해야만 가능합니다.</div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/webapp/js/faq.js"></script>
</body>
</html>
