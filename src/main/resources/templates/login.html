<!DOCTYPE html>
<html lang="ko" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="#ffffff">
    <title>The SkyGradU</title>

    <link href="/webapp/css/basic.css" rel="stylesheet">
    <link href="/webapp/css/auth.css" rel="stylesheet">
    <link href="/webapp/css/mypage.css" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/webapp/images/icon.png">
    <link rel="manifest" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/manifest.json">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="mask-icon" href="/webapp/images/icon.png" color="#712cf9">
    <link rel="icon" href="/webapp/images/icon.ico">

    <style>
        .info_content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .show-password {
            cursor: pointer;
        }
        .background {
            background: url('/webapp/images/loginbackground.png') no-repeat center top;
            background-size: cover;
        }
        .link {
            cursor: pointer;
        }
    </style>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center" style="overflow:auto">
    <!-- 네비게이션 바 포함 -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="background">
        <div class="info_content" style="text-align: center; margin-top: 10px;">
            <div class="login-form">
                <div class="login_logo">
                    <lottie-player id="home_logo" src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 100px; height: 80px" loop autoplay></lottie-player>
                </div>
                <div class="cutstom_login_title">The SkyGradU</div>
                <form onsubmit="return check_up1();" method="post" action="/login">
                    <div class="content">
                        <div class="input-group flex-nowrap">
                            <input type="text" class="form-control" name="username" id="studentID" placeholder="학번">
                        </div>
                        <div class="input-group flex-nowrap" style="margin-top: 1rem;">
                            <input type="password" class="form-control" name="password" id="password1" placeholder="비밀번호" onkeyup="checkCapsLock(event)">
                            <span class="input-group-text show-password" onclick="togglePassword()">🙈</span>
                        </div>
                        <div th:if="${param.error}" style="color: red; margin-top: 1rem;">
                            <h id="capslock-message">😰입력정보를 다시 확인해주세요!</h>
                        </div>
                        <div id="capslock-message" style="color: red; margin-top: 1rem;"></div>
                        <a id="b2" class="link" onclick="openM2()">비밀번호를 잊어버리셨나요?</a>
                    </div>
                    <div class="action">
                        <button class="button-text" id="login_button" type='submit'>로그인</button>
                        <button class="button-text" id="register_button" type="button" onclick="location.href='/auth';">회원가입</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 푸터 포함 -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!--비밀번호 찾기모달-->
    <div id="m2" class="m2-modal">
        <div class="m2-modal-content">
            <div class="modal-header">
                <span class="modal-close" onclick="closeM2()">&times;</span>
                <h2>비밀번호 찾기</h2>
            </div>
            <div class="modal-body" id="passwordUpdateModalStep1">
                <p>
                    성결대 포털 로그인으로 재학생 인증을 진행합니다.<br>
                    (<a href="https://www.sungkyul.ac.kr/portalLogin/skukr/portalLoginForm.do" class="text-black footer_link" style="font-weight: bold;" target="_blank">성결대학교 포털</a> 통합아이디/비밀번호)
                </p>
                <div class="input-group flex-nowrap">
                    <input type="text" class="form-control" name="username" id="id" placeholder="포털 아이디">
                </div>
                <div class="input-group flex-nowrap" style="margin-top:1rem;">
                    <input class="form-control" id="currentPassword" type="password" placeholder="포털 비밀번호 입력">
                    <span class="input-group-text show-password1" onclick="togglePassword1()">🙈</span>
                </div>
                <div id="error-message1" style="color: red; margin-top: 1rem;"></div>
                <button class="m2-button" onclick="verifyCurrentPassword1()">확인</button>
            </div>
            <div id="passwordUpdateModalStep2" style="display: none;">
                <p style="margin-top:1rem">보안을 위해 8자리 이상 입력해주세요!😊</p>
                <input type="password" id="newPassword" placeholder="새 비밀번호" class="form-control">
                <input type="password" id="confirmNewPassword" placeholder="새 비밀번호 확인" class="form-control" style="margin-top:1rem">
                <div id="error-message2" style="color: red; margin-top: 1rem;"></div>
                <button class="m2-button" onclick="changePassword()">변경하기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/webapp/js/login.js"></script>
    <script>
        function openM2() {
            document.getElementById('m2').style.display = 'block';
        }

        function closeM2() {
            document.getElementById('m2').style.display = 'none';
            document.getElementById('error-message1').textContent = '';
        }
    </script>
</body>
</html>
