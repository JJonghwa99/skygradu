<!DOCTYPE html>
<html lang="ko" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The SkyGradU</title>

    <link href="/webapp/css/basic.css" rel="stylesheet">
    <link href="/webapp/css/auth.css" rel="stylesheet">


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/webapp/images/icon.png">
    <link rel="manifest" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/manifest.json">
    <link rel="mask-icon" href="/webapp/images/icon.png" color="#712cf9">
    <link rel="icon" href="/webapp/images/icon.ico">
    <meta name="theme-color" content="#712cf9">

<style>
    .info_content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }
    .show-password {
            cursor: pointer;
        }
    .background {
            background: url('/webapp/images/loginbackground.png') no-repeat center top;
            background-size: cover;
        }
    .link {
           cursor: pointer;
        }

</style>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center"  style="overflow:auto">
<nav class="container-fluid">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-2 border-bottom">
        <a href="/" class="d-flex align-items-center mb-2 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <lottie-player src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 40px; height: 32px" loop autoplay></lottie-player>
            <span class="fs-4" style="color: #000000;">The SkyGradU</span>
        </a>

        <ul class="nav nav-pills navbar-expand-md">
            <li class="nav-item">
                <a href="/" class="nav-link" onclick="showContent('home', this)">Home</a>
            </li>
            <li class="nav-item">
                <a href="/qna" class="nav-link" onclick="showContent('faqs', this)">FAQs</a>
            </li>
            <li class="nav-item">
                <a href="" class="nav-link" onclick="showContent('explain', this)">이용안내</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated() and !hasAuthority('ROLE_ADMIN')">
                <a href="/mypage" class="nav-link" onclick="showContent('mypage', this)">마이페이지</a>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a href="/admin" class="nav-link" onclick="showContent('admin', this)">관리자</a>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a href="/login" class="nav-link" onclick="showContent('login', this)">로그인</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a href="/logout" class="nav-link" onclick="showContent('logout', this)">로그아웃</a>
            </li>

        </ul>
    </header>

</nav>
<div class="background">
<div class="info_content" style="text-align: center; margin-top: 10px;">
    <div class="login-form">
        <div class="login_logo">
            <lottie-player id="home_logo" src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 100px; height: 80px" loop autoplay></lottie-player>
        </div>
        <div class="cutstom_login_title">The SkyGradU</div>
        <form onsubmit="return check_up1();" method="post" action="/login">
            <div class="content">
                <div class="input-group flex-nowrap">
                    <input type="text" class="form-control" name="username" id="studentID" placeholder="학번">
                </div>
                <div class="input-group flex-nowrap" style="margin-top: 1rem;">
                    <input type="password" class="form-control" name="password" id="password1" placeholder="비밀번호" onkeyup="checkCapsLock(event)">
                    <span class="input-group-text show-password" onclick="togglePassword()">🙈</span>
                </div>
                <div th:if="${param.error}"style="color: red; margin-top: 1rem;">
                    <h id="capslock-message">😰입력정보를 다시 확인해주세요!</h>
                </div>
                <div id="capslock-message" style="color: red; margin-top: 1rem;"></div>
                <a id="b2" class="link">비밀번호를 잊어버리셨나요?</a>
            </div>
            <div class="action">
                <button class="button-text" id="login_button" type='submit'>로그인</button>
                <button class="button-text" id="register_button" type="button" onclick="location.href='/auth';">회원가입</button>
            </div>
        </form>
    </div>
</div>

</div>
</div>
<footer class="text-white-100 mastfoot mt-auto">
    <p>© The SkyGradU 2024</p>
    <a href="/faqs/privacy" style="color: #ffffff;">개인정보처리방침</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/webapp/js/login.js"></script>
</body>
</html>
