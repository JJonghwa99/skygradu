<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The SkyGradU</title>

    <link href="/webapp/css/basic.css" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/webapp/images/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/webapp/images/icon.png">
    <link rel="manifest" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/manifest.json">
    <link rel="mask-icon" href="/webapp/images/icon.png" color="#712cf9">
    <link rel="icon" href="/webapp/images/icon.ico">
    <meta name="theme-color" content="#712cf9">

    <!-- 버튼 스타일 -->
<style>
    .btn-login {
    background-color: #4A90E2; /* 더 진한 파란색 배경 */
    border-color: #4A90E2; /* 더 진한 파란색 테두리 */

    }

    .btn-login:hover {
    background-color: #0064E4; /* 파란색 배경 */
    border-color: #87CEEB; /* 하늘색 테두리 */
    color: #FFFFFF; /* 하얀색 텍스트 */
    }

    .btn-signup {
       background-color: #87CEEB; /* 하늘색 배경 */
       color: #FFFFFF; /* 하얀색 텍스트 */
       border-color: #87CEEB; /* 하늘색 테두리 */
               }

    .btn-signup:hover {
    background-color: #20B2AA; /* 청록색 배경 */
    border-color: #20B2AA; /* 청록색 테두리 */
    }
</style>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="d-flex flex-column h-100 text-center">
<nav class="container-fluid">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-2 border-bottom">
        <a href="/" class="d-flex align-items-center mb-2 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <lottie-player src="/webapp/json/homelogo.json" background="transparent" speed="1" style="width: 40px; height: 32px" loop autoplay></lottie-player>
            <span class="fs-4" style="color: #000000;">The SkyGradU</span>
        </a>

        <ul class="nav nav-pills navbar-expand-md">
            <li class="nav-item"><a href="/" class="nav-link " onclick="window.location.href='/'">Home</a></li>
            <li class="nav-item"><a href="/qna" class="nav-link" onclick="window.location.href='/faqs'">FAQs</a></li>
            <li class="nav-item"><a href="" class="nav-link" onclick="window.location.href='/explain'">이용안내</a></li>
            <li class="nav-item"><a href="/login" class="nav-link active" onclick="window.location.href='/login'">로그인</a></li>
        </ul>
    </header>

</nav>

<!--  html 전체 영역을 지정하는 container -->
<div id="container">
    <!--  login 폼 영역을 : loginBox -->
    <div id="loginBox">

        <!-- 로그인 페이지 타이틀 -->
        <div id="loginBoxTitle">로그인</div>
        <!-- 아이디, 비번, 버튼 박스 -->
        <div id="inputBox">
            <div class="input-form-box"><span>학번 </span><input type="text" name="uid" class="form-control"></div>
            <div class="input-form-box"><span>비밀번호 </span><input type="password" name="upw" class="form-control"></div>
            <div class="button-login-box">
                <button type="button" class="btn btn-login btn-xs" style="width:100%" onclick="window.location.href='/signgup'">로그인</button>
                <button type="button" class="btn btn-signup btn-xs" style="width:100%" onclick="window.location.href='/auth'">회원가입</button>
            </div>
        </div>

    </div>

</div>
<footer class="text-white-100 mastfoot mt-auto">
    <p>© The SkyGradU 2024</p>
    <a href="/faqs/privacy" style="color: #ffffff;">개인정보처리방침</a>
</footer>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
